    <rect x="412" y="400" width="18" height="28" rx="7"/>
  </g>

  <!-- Helle Fläche hinter dem Schloss -->
  <circle cx="270" cy="272" r="126" fill="#00a4dc" opacity="0.10"/>

  <!-- Schloss -->
  <g filter="url(#lockGlow)">
    <path d="M218 250v-28c0-28.7 23.3-52 52-52s52 23.3 52 52v28" fill="none" stroke="url(#accent)" stroke-width="24" stroke-linecap="round"/>
    <rect x="188" y="244" width="164" height="124" rx="28" fill="url(#accent)"/>
    <circle cx="270" cy="290" r="18" fill="#06111d"/>
    <rect x="261" y="296" width="18" height="40" rx="9" fill="#06111d"/>
  </g>

  <!-- Textblock -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="518" y="174" font-size="18" font-weight="700" letter-spacing="6" fill="#6ee7f9">JELLYFIN PLUGIN</text>
    <rect x="518" y="194" width="52" height="3" rx="1.5" fill="#00a4dc"/>
    <text x="514" y="284" font-size="82" font-weight="800" letter-spacing="1" fill="#f4fbff">MOVIE</text>
    <text x="514" y="368" font-size="82" font-weight="800" letter-spacing="1" fill="url(#textAccent)">CODE</text>

    <!-- Sechs Einmalcode-Stellen -->
    <g>
      <circle cx="526" cy="414" r="11" fill="#eafaff"/>
      <circle cx="568" cy="414" r="11" fill="#eafaff"/>
      <circle cx="610" cy="414" r="11" fill="#eafaff"/>
      <circle cx="652" cy="414" r="11" fill="#eafaff"/>
      <circle cx="694" cy="414" r="11" fill="#eafaff"/>
      <circle cx="736" cy="414" r="11" fill="#6ee7f9"/>
    </g>

    <text x="518" y="474" font-size="22" font-weight="600" letter-spacing="5" fill="#b9d9e6">10 EINMALCODES</text>
    <text x="518" y="506" font-size="15" font-weight="400" letter-spacing="1.5" fill="#7fb4c8">EIN CODE &#183; EIN FILM</text>
  </g>
