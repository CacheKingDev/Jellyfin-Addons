    <rect x="72" y="563" width="26" height="7" rx="3"/>
    <rect x="122" y="563" width="26" height="7" rx="3"/>
    <rect x="172" y="563" width="26" height="7" rx="3"/>
    <rect x="222" y="563" width="26" height="7" rx="3"/>
    <rect x="272" y="563" width="26" height="7" rx="3"/>
    <rect x="322" y="563" width="26" height="7" rx="3"/>
    <rect x="372" y="563" width="26" height="7" rx="3"/>
    <rect x="422" y="563" width="26" height="7" rx="3"/>
    <rect x="472" y="563" width="26" height="7" rx="3"/>
    <rect x="522" y="563" width="26" height="7" rx="3"/>
    <rect x="572" y="563" width="26" height="7" rx="3"/>
    <rect x="622" y="563" width="26" height="7" rx="3"/>
    <rect x="672" y="563" width="26" height="7" rx="3"/>
    <rect x="722" y="563" width="26" height="7" rx="3"/>
    <rect x="772" y="563" width="26" height="7" rx="3"/>
    <rect x="822" y="563" width="26" height="7" rx="3"/>
    <rect x="872" y="563" width="26" height="7" rx="3"/>
    <rect x="922" y="563" width="26" height="7" rx="3"/>
    <rect x="972" y="563" width="26" height="7" rx="3"/>
  </g>

  <!-- Filmrahmen mit Schloss -->
  <g filter="url(#softShadow)">
    <rect x="92" y="104" width="356" height="352" rx="36" fill="url(#ticket)" stroke="#1b6c8a" stroke-width="3"/>
    <rect x="92" y="104" width="356" height="352" rx="36" fill="none" stroke="#6ee7f9" stroke-opacity="0.18" stroke-width="1.5"/>
  </g>

  <!-- Perforationen im Filmrahmen -->
  <g fill="#041019">
    <rect x="110" y="130" width="18" height="28" rx="7"/>
    <rect x="110" y="184" width="18" height="28" rx="7"/>
    <rect x="110" y="238" width="18" height="28" rx="7"/>
    <rect x="110" y="292" width="18" height="28" rx="7"/>
    <rect x="110" y="346" width="18" height="28" rx="7"/>
    <rect x="110" y="400" width="18" height="28" rx="7"/>

    <rect x="412" y="130" width="18" height="28" rx="7"/>
