<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="576" viewBox="0 0 1024 576" role="img" aria-label="Movie Code">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="0.55" stop-color="#09283a"/>
      <stop offset="1" stop-color="#0b4f6c"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="48%" r="62%">
      <stop offset="0" stop-color="#00a4dc" stop-opacity="0.40"/>
      <stop offset="0.55" stop-color="#00a4dc" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00a4dc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="78%" cy="42%" r="48%">
      <stop offset="0" stop-color="#00a4dc" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#00a4dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8beaf7"/>
      <stop offset="1" stop-color="#00a4dc"/>
    </linearGradient>
    <linearGradient id="textAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8beaf7"/>
      <stop offset="1" stop-color="#00a4dc"/>
    </linearGradient>
    <linearGradient id="ticket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c3145"/>
      <stop offset="1" stop-color="#071c2a"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
    <filter id="lockGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#00a4dc" flood-opacity="0.60"/>
    </filter>
  </defs>

  <rect width="1024" height="576" fill="url(#background)"/>
  <rect width="1024" height="576" fill="url(#glow)"/>
  <rect width="1024" height="576" fill="url(#glowRight)"/>

  <!-- Dekorative Filmstreifen oben und unten -->
  <g fill="#041019" opacity="0.55">
    <rect x="0" y="0" width="1024" height="18"/>
    <rect x="0" y="558" width="1024" height="18"/>
  </g>
  <g fill="#6ee7f9" opacity="0.16">
