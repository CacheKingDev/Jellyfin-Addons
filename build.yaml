overview: "Code-Popup beim Filmstart: Ein Einmalcode gibt genau einen Film für einen Benutzer frei."
description: >-
  Ein Administrator erzeugt für einen Benutzer einen 6-stelligen Einmalcode.
  Der Benutzer durchsucht die Mediathek normal; beim Start eines Films fragt
  ein Popup im Web-Client den Code ab. Danach ist genau dieser Film freigegeben.
  Nach dem Filmende verfällt die Freigabe.
