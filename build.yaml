overview: "Code-Popup beim Filmstart: 10 Einmalcodes, jeder gibt genau einen Film für einen Benutzer frei."
description: >-
  Ein Administrator erzeugt in der Kindersicherung eines Benutzers ein Paket
  aus 10 Einmalcodes und zeigt die Liste einmalig an. Der Benutzer durchsucht
  die Mediathek normal; beim Start eines Films fragt ein Popup im Web-Client
  einen Code ab. Jeder Code gilt genau einmal für einen Film. Nach dem Filmende
  kann der nächste Code aus dem Paket verwendet werden; es ist immer nur ein
  Film gleichzeitig freigegeben.
